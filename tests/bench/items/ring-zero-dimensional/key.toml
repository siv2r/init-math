# The statement is FALSE (true neighbour: a Noetherian ring of dimension 0 is Artinian; the
# added hypothesis 'nilradical nilpotent' does not replace Noetherian).
# Counterexample check by hand: in R = F2[x_1, x_2, ...]/(x_i x_j), every x_i is nilpotent, so
# every prime contains m = (x_1, x_2, ...), and R/m = F2, so m is the unique prime, maximal.
# m^2 = 0. R = F2 + m with m = F2-span of the x_i and R x_j = F2 x_j, so the ideal (x_k, x_(k+1), ...)
# is the span of x_k, x_(k+1), ..., and these ideals strictly decrease: R is not Artinian.
# Every other step (CRT, the idempotent decomposition, additivity of length, finite length
# implies DCC) is correct. Any finite ring is Artinian, so no finite check refutes the claim.
