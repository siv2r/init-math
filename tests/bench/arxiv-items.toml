# Reviewer-bench items built from recent arXiv corrections.
#
# The items themselves stay outside the repository: their text is verbatim from papers whose
# licences do not allow redistribution. This file records which paper and version each item
# comes from, so the set can be rebuilt. Procedure: pick a math paper first posted after the
# reviewer model's training data whose later version or withdrawal names an error in a
# proof; diff the version with the error against the correction; excerpt the result, its
# proof and what it depends on, stripped of anything identifying the paper; key the step
# the authors changed; have a second model audit the key against the diff. A slip that is
# present in every version and is not the keyed error may be repaired in the excerpt; the
# repair is recorded in the item's key as `excerpt_edit`. A `-decoy` item adds one
# model-written, blatant, repairable slip beside the authors' error (`decoy = true`); its
# real error is still the authors'.

[[item]]
id = "arx-brouwer-wkl"
kind = "flawed"
fix_needs_review = true
source = "arXiv:2609.04644v2 (error); arXiv:2609.04644v3 (correction)"
error_class = "misapplied theorem (WKL/BKL applied to a non-decidable tree)"
statement_true = "yes (WKL implies Brouwer's fixed-point theorem over EL_0 is proved in the corrected version by a different route, Sperner-based approximate fixed points plus the minimum principle, which is cited as equivalent to WKL over EL_0; the classical analogue over RCA_0 is standard)"
excerpt_edit = true

